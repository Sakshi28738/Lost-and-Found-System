
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Item | Lost & Found</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <nav class="navbar">
        <div class="logo">Lost & Found</div>
        <div class="nav-links">
            <a href="/">Home</a>
        </div>
    </nav>

    <section class="section">
        <h1>
           Report a {{ report_type }} Item
        </h1>
        <p>Provide the details below to help reunite belongings with their owners.</p>

        <form action="{{ url_for('submit_report') }}" method="POST">

            <label>Report Type</label>
            <select name="report_type" required>
                <option value="Lost"
                    {% if report_type == 'Lost' %}selected{% endif %}>
                    Lost
                </option>

                <option value="Found"
                    {% if report_type == 'Found' %}selected{% endif %}>
                    Found
                </option>
            </select>
            <label>Item Name</label>
            <input type="text" name="item_name" placeholder="Enter item name" required>

            <label>Category</label>
            <select name="category" required>
                <option value="">Select category</option>
                <option value="Electronics">Electronics</option>
                <option value="Books">Books</option>
                <option value="Accessories">Accessories</option>
                <option value="Documents">Documents</option>
                <option value="Clothing">Clothing</option>
                <option value="Others">Others</option>
            </select>

            <label>Description</label>
            <textarea name="description" placeholder="Describe the item..." required></textarea>

            <label>Location</label>
            <input type="text" name="location" placeholder="Where was it lost or found?" required>

            <label>Contact Details</label>
            <input type="text" name="contact" placeholder="Enter your contact details" required>

            <button type="submit" class="btn btn-found">Submit Report</button>

        </form>
    </section>

</body>
</html>
